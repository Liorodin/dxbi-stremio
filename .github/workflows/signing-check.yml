name: Signing check (temporary)

# Compares the TV signing secrets with the local key files by fingerprint only, then tries to open
# the keystore the way the build does. Delete once signing works.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Fingerprints and keytool
        env:
          B64: ${{ secrets.DXBI_TV_KEYSTORE_B64 }}
          PW: ${{ secrets.DXBI_TV_KEYSTORE_PASSWORD }}
        run: |
          echo "b64 length: ${#B64}"
          echo "password length: ${#PW}"
          printf '%s' "$PW" | sha256sum | sed 's/^/password sha256: /'
          echo "$B64" | base64 -d > "$RUNNER_TEMP/k.p12"
          sha256sum "$RUNNER_TEMP/k.p12" | sed 's/^/keystore sha256: /'
          keytool -list -keystore "$RUNNER_TEMP/k.p12" -storepass "$PW" -alias dxbi-tv && echo "KEYTOOL_OK" || echo "KEYTOOL_FAILED"
